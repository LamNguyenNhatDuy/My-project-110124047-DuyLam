<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Học Phí Sinh Viên</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Cổng Tra Cứu Học Phí Sinh Viên</h2>
        
        <div class="search-box">
            <input type="text" id="masv-input" placeholder="Nhập mã số sinh viên (Ví dụ: SV001, SV002...)" />
            <button onclick="traCuuHocPhi()">Tra cứu</button>
        </div>

        <div class="result-container" id="result-area">
            </div>
    </div>

    <script>
        // Kho dữ liệu học phí mẫu (Các lớp DA24TTA, TTB, TTC, TTD)
        const danhSachHocPhi = [
            { mssv: "110124047", ten: "Lâm Nguyễn Nhật Duy", lop: "DA24TTA", hocKy: "Học kỳ 1 (2025-2026)", sotien: "9.500.000 đ" },
            { mssv: "SV002", ten: "Le Thi B", lop: "DA24TTB", hocKy: "Học kỳ 1 (2025-2026)", sotien: "9.500.000 đ" },
            { mssv: "SV003", ten: "Tran Van C", lop: "DA24TTC", hocKy: "Học kỳ 1 (2025-2026)", sotien: "10.200.000 đ" },
            { mssv: "SV004", ten: "Hoang Thi D", lop: "DA24TTD", hocKy: "Học kỳ 1 (2025-2026)", sotien: "10.200.000 đ" },
            { mssv: "SV005", ten: "Pham Van E", lop: "DA24TTA", hocKy: "Học kỳ 2 (2025-2026)", sotien: "8.800.000 đ" }
        ];

        function traCuuHocPhi() {
            // Lấy giá trị user nhập vào, bỏ khoảng trắng và chuyển thành chữ in hoa
            const inputVal = document.getElementById("masv-input").value.trim().toUpperCase();
            const resultArea = document.getElementById("result-area");
            
            // Xóa kết quả cũ trước khi tìm kiếm mới
            resultArea.innerHTML = "";

            if (inputVal === "") {
                resultArea.innerHTML = "<p class='no-result'>Vui lòng nhập mã số sinh viên cần tra cứu!</p>";
                return;
            }

            // Tìm kiếm sinh viên có MSSV trùng khớp
            const sinhVien = danhSachHocPhi.find(sv => sv.mssv === inputVal);

            if (sinhVien) {
                // Nếu tìm thấy, dựng cấu trúc bảng hiển thị thông tin lên màn hình
                resultArea.innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Mã số SV</th>
                                <th>Tên sinh viên</th>
                                <th>Lớp</th>
                                <th>Học kỳ</th>
                                <th>Học phí phải nộp</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><strong>${sinhVien.mssv}</strong></td>
                                <td>${sinhVien.ten}</td>
                                <td>${sinhVien.lop}</td>
                                <td>${sinhVien.hocKy}</td>
                                <td style="color: #e74c3c; font-weight: bold;">${sinhVien.sotien}</td>
                            </tr>
                        </tbody>
                    </table>
                `;
            } else {
                // Nếu không tìm thấy
                resultArea.innerHTML = "<p class='no-result'>Không tìm thấy thông tin cho mã số sinh viên này.</p>";
            }
        }
    </script>
</body>
</html>
